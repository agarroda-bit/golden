    const target = who || (S.players.length ? rnd(S.players) : '');
    const C = caller === 'azar' ? rnd(CALLERS) : CALLERS[+caller];
    if(when === 'ya'){ later(() => ring(target, C), 1500); stage.innerHTML = '<div class="bigword" style="font-size:clamp(40px,12vw,60px)">Atentos…</div>'; stage.onclick = null; return; }
    wake(true); S.cleanup.push(() => wake(false));
    later(() => ring(target, C), 60000 + Math.random()*180000);
    stage.innerHTML = `<div class="card pop"><div class="clabel">LLAMADA PROGRAMADA</div><div class="ctext">Llegará cuando menos lo espere.</div><div class="cfoot">Deja esta pantalla abierta y el móvil en la mesa. Seguid a lo vuestro.</div></div><div class="actions"><button class="btn ghost" data-a="x">CANCELAR</button></div>`;
    stage.onclick = e => { if(e.target.closest('[data-a=x]')){ blip(); clearT(); setup(); } };
  };
  const PH = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  const ring = (target, C) => {
    const ov = document.createElement('div'); ov.className = 'call ringing';
    ov.innerHTML = `<div class="who"><p>${target ? '¡' + esc(target) + ', es para ti!' : 'Llamada entrante'}</p><div class="av">${C.init}</div><h2>${esc(C.who)}</h2><p>móvil</p></div>
      <div class="btns"><button class="cb no" data-k="no"><i style="transform:rotate(135deg)">${PH}</i>Rechazar</button><button class="cb ok" data-k="ok"><i>${PH}</i>Aceptar</button></div>`;
    document.body.appendChild(ov);
    S.cleanup.push(() => ov.remove());
    let ringing = true;
    const rt = () => { if(!ringing) return; [0,160,320,480].forEach((t,k) => later(() => ringing && tone(k%2 ? 1320 : 1560, .14, 'sine', .12), t)); buzz([600,300,600]); later(rt, 2600); };
    rt();
    ov.addEventListener('click', e => {
      const k = e.target.closest('[data-k]'); if(!k) return; ringing = false;
      if(k.dataset.k === 'no'){ ov.remove(); tone(300,.3,'sine',.1); result(target, C, 0, true); }
      else talk(ov, target, C);
    });
  };
  const talk = (ov, target, C) => {
    ov.className = 'call';
    const t0 = Date.now(); let k = 0, done = false;
    ov.innerHTML = `<div class="who"><h2>${esc(C.who)}</h2><p id="ctime">00:00</p></div><div class="line" id="cline">…</div>
      <div class="btns"><button class="cb no" data-k="hang"><i style="transform:rotate(135deg)">${PH}</i>Colgar</button></div>`;
    const clock = () => { if(done) return; const s = Math.floor((Date.now()-t0)/1000); const el = $('#ctime', ov); if(el) el.textContent = String(s/60|0).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); later(clock, 1000); }; clock();
    const finish = () => { if(done) return; done = true; hush(); const secs = Math.floor((Date.now()-t0)/1000); ov.remove(); tone(420,.2,'sine',.1); later(() => tone(420,.2,'sine',.1), 300); result(target, C, secs, false); };
    const next = () => {
      if(done) return;
      if(k >= C.lines.length) return later(finish, 1500);
      const line = C.lines[k++]; const el = $('#cline', ov); if(el) el.textContent = '«' + line + '»';
      const u = say(line, {force:true, rate:C.rate, pitch:C.pitch, end: () => { if(!done){ const el2 = $('#cline', ov); later(() => { if(!done && el2) el2.innerHTML += '<br><small style="color:#c9d3dd">Contesta…</small>'; }, 50); later(next, 6500); } }});
      if(!u) later(next, 8000);
    };
    later(next, 800);
    ov.addEventListener('click', e => { if(e.target.closest('[data-k=hang]')) finish(); });
  };
  const result = (target, C, secs, rejected) => {
    stage.innerHTML = rejected
      ? cardHTML('LLAMADA RECHAZADA', `${target ? esc(target) + ' ha' : 'Has'} colgado a ${esc(C.who.toLowerCase())}.`, '<b>3 tragos</b> por cobarde.')
      : cardHTML('LLAMADA TERMINADA', `${esc(C.who)} · ${String(secs/60|0)}:${String(secs%60).padStart(2,'0')}`, '¿Se ha reído, se ha trabado o no ha colado? La mesa decide: <b>2 tragos</b>.');
    stage.innerHTML += `<div class="actions"><button class="btn" data-a="again">OTRA LLAMADA</button></div>`;
    stage.onclick = e => { if(e.target.closest('[data-a=again]')){ blip(); setup(); } };
  };
  setup();
}

/* ---------- el confesionario ---------- */
function confesionario(stage){
  setupPass(stage, 'Jugadores', '', names => {
    const secrets = []; let i = 0;
    const pass = () => {
      stage.innerHTML = `<div class="turn pop"><small>Pásale el móvil a</small><h2>${esc(names[i])}</h2></div><p class="hint">Escribe un secreto. Nadie sabrá que es tuyo.</p><div class="actions"><button class="btn big" data-a="w">ESCRIBIR</button></div>`;
    };
    const write = () => {
      stage.innerHTML = `<p class="sub">Secreto de ${esc(names[i])}</p><textarea class="conf" id="cf" maxlength="220" placeholder="Idea: ${esc(rnd(CONFP))}"></textarea>
        <p class="hint">Escríbelo sin pistas obvias: «Una vez me…».</p>
        <div class="actions"><button class="btn ghost" data-a="skip">PASAR</button><button class="btn" data-a="save">GUARDAR Y PASAR</button></div>`;
      setTimeout(() => { const t = $('#cf'); t && t.focus(); }, 60);
    };
    const advance = () => { i++; if(i < names.length) pass(); else listen(names, shuffle(secrets)); };
    stage.onclick = e => {
      const x = e.target.closest('[data-a]'); if(!x) return; blip();
      if(x.dataset.a === 'w') write();
      else if(x.dataset.a === 'save'){ const v = $('#cf').value.trim(); if(v) secrets.push({t:v, who:names[i]}); advance(); }
      else if(x.dataset.a === 'skip') advance();
    };
    pass();
  });

  /* 1. Se leen todos los secretos, sin autor */
  const listen = (names, list) => {
    if(list.length < 2){
      stage.innerHTML = cardHTML('POCAS CONFESIONES', 'Hacen falta al menos dos secretos.', 'Cobardes. Bebéis todos.') + `<div class="actions"><button class="btn" data-a="re">OTRA RONDA</button></div>`;
      stage.onclick = e => { if(e.target.closest('[data-a=re]')){ blip(); confesionario(stage); } }; return;
    }
    const readAll = () => { hush(); list.forEach((c, k) => say(`Confesión ${k+1}. ${c.t}`, {force:true, queue:true})); };
    stage.innerHTML = `<p class="sub">Las confesiones de la noche</p>
      <div class="list">${list.map((c,k) => `<div><b>${k+1}.</b> «${esc(c.t)}»</div>`).join('')}</div>
      <p class="hint">Escuchadlas bien. Después, cada uno dirá en secreto de quién cree que es cada una.</p>
      <div class="actions"><button class="btn ghost" data-a="read">LEER EN VOZ ALTA</button><button class="btn" data-a="go">A ADIVINAR</button></div>`;
    readAll();
    stage.onclick = e => { const x = e.target.closest('[data-a]'); if(!x) return; blip(); if(x.dataset.a === 'read') readAll(); else { hush(); guess(names, list); } };
  };

  /* 2. Cada jugador, en secreto, empareja cada secreto con un jugador */
  const guess = (names, list) => {
    const hits = list.map(() => 0), score = {}; let p = 0;
    const pass = () => {
      stage.innerHTML = `<div class="turn pop"><small>Pásale el móvil a</small><h2>${esc(names[p])}</h2></div><p class="hint">Empareja cada secreto con su autor. Que nadie mire.</p><div class="actions"><button class="btn big" data-a="g">EMPAREJAR</button></div>`;
    };
    const panel = () => {
      const me = names[p], pick = {};
      const mine = list.map((c,k) => c.who === me ? k : -1).filter(k => k >= 0);
      const todo = list.map((_,k) => k).filter(k => !mine.includes(k));
      const others = names.filter(n => n !== me);
      stage.innerHTML = `<p class="sub">${esc(me)}: ¿de quién es cada secreto?</p>
        <div class="list">${todo.map(k => `<div data-k="${k}"><b>${k+1}.</b> «${esc(list[k].t)}»<div class="chips" style="justify-content:flex-start;margin-top:10px">${others.map(n => `<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('')}</div>
        ${mine.length ? `<p class="muted">Tu secreto no sale en tu lista.</p>` : ''}
        <div class="actions"><button class="btn" data-a="ok" disabled style="opacity:.4">GUARDAR Y PASAR</button></div>`;
      const btn = $('[data-a=ok]', stage);
      stage.onclick = e => {
        const n = e.target.closest('[data-n]');
        if(n){ blip(); const row = n.closest('[data-k]'); const k = +row.dataset.k; pick[k] = n.dataset.n;
          row.querySelectorAll('[data-n]').forEach(b => b.classList.toggle('on', b === n));
          const all = todo.every(t => pick[t]); btn.disabled = !all; btn.style.opacity = all ? 1 : .4; return; }
        if(e.target.closest('[data-a=ok]') && !btn.disabled){
          blip(); let good = 0;
          todo.forEach(k => { if(pick[k] === list[k].who){ hits[k]++; good++; } });
          score[me] = good; p++;
          if(p < names.length){ pass(); stage.onclick = e2 => { if(e2.target.closest('[data-a=g]')){ blip(); panel(); } }; }
          else reveal(names, list, hits, score);
        }
      };
    };
    pass();
    stage.onclick = e => { if(e.target.closest('[data-a=g]')){ blip(); panel(); } };
  };

  /* 3. Solo se destapa el secreto más acertado */
  const reveal = (names, list, hits, score) => {
    stage.onclick = null;
    const max = Math.max(...hits), top = max > 0 ? list.map((c,k) => hits[k] === max ? k : -1).filter(k => k >= 0) : [];
    const best = Object.entries(score).sort((a,b) => b[1]-a[1])[0];
    stage.innerHTML = `<div class="bigword" style="font-size:clamp(40px,12vw,64px)">CONTANDO…</div>`;
    for(let k=0;k<22;k++) later(() => tone(90 + Math.random()*30, .05, 'triangle', .12), k*70);
    later(() => {
      if(!top.length){
        say('Nadie ha acertado ningún secreto. Todos los secretos quedan a salvo.', {force:true});
        stage.innerHTML = cardHTML('SECRETOS A SALVO', 'Nadie ha acertado ni uno.', 'Ningún autor se destapa. <b>Bebéis todos</b> por malos detectives.', '', false);
      } else {
        const who = top.map(k => list[k].who);
        say(top.length > 1 ? 'Hay empate. Se destapan estos secretos.' : `El secreto más acertado es de ${who[0]}.`, {force:true});
        stage.innerHTML = `<p class="sub">${top.length > 1 ? 'Empate: se destapan los más acertados' : 'El secreto más acertado'}</p>`
          + top.map(k => `<div class="card pop" style="min-height:0"><div class="clabel">CONFESIÓN ${k+1} · ${hits[k]} DE ${names.length - 1} ACERTARON</div><div class="ctext" style="font-size:clamp(20px,5.6vw,26px)">«${esc(list[k].t)}»</div><div class="cfoot">Lo escribió <b style="color:var(--c);font-size:18px">${esc(list[k].who)}</b>. Bebe ${hits[k]} trago${hits[k]===1?'':'s'}, uno por cada acierto.</div></div>`).join('')
          + `<p class="hint">El resto de secretos quedan en secreto.</p>`;
        boom(); buzz([200,60,200]);
      }
      stage.innerHTML += (best && best[1] > 0 ? `<p class="hint">Mejor detective: <b>${esc(best[0])}</b>, con ${best[1]} acierto${best[1]===1?'':'s'}. Reparte 3.</p>` : '')
        + `<div class="actions"><button class="btn" data-a="re">OTRA RONDA</button></div>`;
      stage.onclick = e => { if(e.target.closest('[data-a=re]')){ blip(); confesionario(stage); } };
    }, 1800);
  };
}

/* ---------- quiz de fútbol ---------- */
function quiz(stage){
  const LV = {facil:['FÁCIL','Para todo el mundo','#3ee08f',1,2,20], dificil:['DIFÍCIL','Para los que ven fútbol cada semana','#ffb547',2,1,20], extremo:['EXTREMO','Historia pura. Solo para enfermos del fútbol','#ff3d6e',3,1,25]};
  const menu = () => {
    stage.innerHTML = `<div class="rules pop"><p class="sub">Elige el nivel</p><div class="lvls">${Object.entries(LV).map(([k,v]) => `<button data-l="${k}"><b>${v[0]}</b><span>${v[1]} · aciertas: repartes ${v[3]} · fallas: bebes ${v[4]}</span><em style="background:${v[2]}">${v[0]}</em></button>`).join('')}</div></div>`;
    stage.onclick = e => { const l = e.target.closest('[data-l]'); if(l){ blip(); play(l.dataset.l); } };
  };
  const play = lv => {
    const [nm, , col, give, drink, secs] = LV[lv];
    const qs = shuffle(QUIZ[lv]).slice(0, 10), order = S.players.length ? shuffle(S.players) : [null], score = {};
    let n = 0;
    const ask = () => {
      if(n >= qs.length) return end();
      const [q, ok, ...bad] = qs[n], w = order[n % order.length], opts = shuffle([ok, ...bad]);
      let answered = false;
      stage.innerHTML = `<div class="counters"><span>${nm}</span><span>Pregunta <b>${n+1}/${qs.length}</b></span>${w ? `<span>Le toca a <b>${esc(w)}</b></span>` : ''}</div>`
        + cardHTML('QUIZ DE FÚTBOL', esc(q), '') .replace('min-height:290px','')
        + `<div style="width:100%;height:6px;background:var(--line);border-radius:6px;overflow:hidden"><div id="qt" style="height:100%;width:100%;background:${col}"></div></div>
        <div class="opts">${opts.map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="msg" id="qm"></div>`;
      const T0 = performance.now();
      frame(() => { if(answered) return false; const r = (performance.now()-T0)/(secs*1000); const bar = $('#qt'); if(bar) bar.style.width = Math.max(0,100-r*100)+'%'; if(r >= 1){ judge(null); return false; } });
      const judge = pickd => {
        if(answered) return; answered = true;
        stage.querySelectorAll('[data-o]').forEach(b => { if(b.dataset.o === ok) b.classList.add('ok'); else if(b.dataset.o === pickd) b.classList.add('ko'); b.disabled = true; });
        const right = pickd === ok, who = w ? esc(w) : 'Tú';
        if(right){ score[w || 'Tú'] = (score[w || 'Tú']||0) + 1; tone(880,.15,'triangle',.1); later(() => tone(1320,.2,'triangle',.1), 120); }
        else { tone(160,.4,'sawtooth',.08); buzz(200); }
        const msg = right ? `¡Correcto! ${who} reparte ${give}.` : (pickd === null ? `Tiempo. ${who} bebe ${drink}.` : `Fallo. Era «${esc(ok)}». ${who} bebe ${drink}.`);
        $('#qm').className = 'msg ' + (right ? 'good' : 'bad'); $('#qm').innerHTML = msg; say(plain(msg));
        const nx = document.createElement('div'); nx.className = 'actions'; nx.innerHTML = `<button class="btn" data-a="nx">${n+1 < qs.length ? 'SIGUIENTE' : 'VER RESULTADO'}</button>`; stage.appendChild(nx);
      };
      stage.onclick = e => { const o = e.target.closest('[data-o]'); if(o && !answered){ judge(o.dataset.o); return; } if(e.target.closest('[data-a=nx]')){ blip(); n++; ask(); } };
    };
    const end = () => {
      const r = Object.entries(score).sort((a,b) => b[1]-a[1]);
      stage.innerHTML = `<div class="turn pop"><small>Nivel ${nm}</small><h2>RESULTADO</h2></div>
        <div class="rank">${r.length ? r.map(([k,v],i) => `<div><i>${i+1}</i><span>${esc(k)}</span><em>${v}</em></div>`).join('') : '<p class="muted">Nadie ha acertado ni una. Bebéis todos.</p>'}</div>
        <div class="actions"><button class="btn" data-a="re">OTRA PARTIDA</button><button class="btn ghost" data-a="lv">NIVEL</button></div>`;
      stage.onclick = e => { const x = e.target.closest('[data-a]'); if(!x) return; blip(); x.dataset.a === 're' ? play(lv) : menu(); };
    };
    ask();
  };
  menu();
}

/* ---------- ¿qué canción es? ---------- */
const AUD = new Audio(); AUD.preload = 'auto';
function jsonp(url, ms=9000){
  return new Promise((res, rej) => {
    const cb = 'lp_cb_' + Math.random().toString(36).slice(2);
    const sc = document.createElement('script');
    const t = setTimeout(() => { cleanup(); rej(new Error('timeout')); }, ms);
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } sc.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error('red')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(sc);
  });
}
async function findSong(term){
  const d = await jsonp('https://itunes.apple.com/search?country=ES&entity=song&limit=3&term=' + encodeURIComponent(term));
  const r = (d.results || []).find(x => x.previewUrl);
  if(!r) throw new Error('sin resultado');
  return {url:r.previewUrl, title:r.trackName, artist:r.artistName, art:(r.artworkUrl100||'').replace('100x100','300x300')};
}
function cancion(stage){
  let cat = load('lp_scat', 'todas'), len = load('lp_slen', 2), auto = false, every = load('lp_sev', 120), cur = null, nextP = null, revealed = false, playing = false, extra = 0, autoAt = 0;
  const pool = () => cat === 'todas' ? [...SONGS.reggaeton, ...SONGS.espanol, ...SONGS.internacional] : SONGS[cat];
  let deck = Deck(pool());
  const fetchNext = () => { const term = deck(); return findSong(term).catch(() => findSong(deck())); };
  const ensure = async () => { if(cur) return cur; if(!nextP) nextP = fetchNext(); cur = await nextP; nextP = fetchNext(); return cur; };
  const draw = () => {
    stage.innerHTML = `
      ${chipsHTML([['todas','Todas'],['reggaeton','Reguetón y latino'],['espanol','Español'],['internacional','Internacional']], cat, 'cat')}
      <button class="disc" id="disc" aria-label="Reproducir">${revealed && cur && cur.art ? `<img src="${esc(cur.art)}" alt="">` : ''}</button>
      <div class="msg" id="smsg">${revealed ? '' : 'Toca el disco'}</div>
      <div id="rev" style="width:100%"></div>
      <div class="actions"><button class="btn ghost" data-a="rep">OTRA VEZ</button><button class="btn ghost" data-a="more">+1 SEG</button><button class="btn" data-a="rev">${revealed ? 'SIGUIENTE' : 'REVELAR'}</button></div>
      <p class="sub" style="align-self:center">Duración del trozo</p>
      ${chipsHTML([['1','1 segundo'],['2','2 segundos'],['5','5 segundos']], String(len), 'len')}
      <div class="auto">
        <button class="toggle ${auto?'on':''}" data-a="auto"><i></i><span><b>Modo automático:</b> suena sola mientras hacéis la previa</span></button>
        ${chipsHTML([['30','Cada 30 s'],['60','Cada minuto'],['120','Cada 2 min'],['300','Cada 5 min']], String(every), 'ev')}
        <div class="cd" id="cd">${auto ? '' : 'Apagado'}</div>
      </div>`;
    if(revealed && cur) showRev();
  };
  const showRev = () => { const r = $('#rev'); if(r && cur) r.innerHTML = `<div class="song pop">${cur.art ? `<img src="${esc(cur.art)}" alt="">` : ''}<div><b>${esc(cur.title)}</b><span>${esc(cur.artist)}</span></div></div><p class="hint" style="margin-top:10px">Quien la haya dicho primero <b>reparte 2</b>. Si nadie: <b>bebéis todos</b>.</p>`; };
  let stopT = null;
  const stopAudio = () => { if(stopT){ clearTimeout(stopT); stopT = null; } try{ AUD.pause(); }catch(e){} playing = false; const d = $('#disc'); d && d.classList.remove('spin'); };
  S.cleanup.push(stopAudio);
  const play = async secs => {
    const m = $('#smsg');
    try{
      if(!cur){ m && (m.textContent = 'Cargando…'); }
      const s = await ensure();
      if(AUD.src !== s.url){ AUD.src = s.url; }
      stopAudio();
      AUD.currentTime = 0;
      const d = $('#disc'); d && d.classList.add('spin'); playing = true;
      m && (m.textContent = '¿Qué canción es?');
      const onPlay = () => { AUD.removeEventListener('playing', onPlay); stopT = setTimeout(stopAudio, secs*1000); };
      AUD.addEventListener('playing', onPlay);
      await AUD.play();
    }catch(e){
      stopAudio();
      m && (m.innerHTML = '<span style="color:var(--pink)">No se ha podido cargar la canción.</span><br><span style="font-size:15px;color:var(--mute);font-family:var(--body)">Hace falta internet. En la página de Claude no funciona: ábrela desde el icono del móvil.</span>');
      cur = null; nextP = null;
    }
  };
  const scheduleAuto = () => {
    if(!auto) return;
    autoAt = Date.now() + every*1000;
    const tick = () => {
      if(!auto) return;
      const left = Math.max(0, Math.round((autoAt - Date.now())/1000));
      const cd = $('#cd'); if(cd) cd.textContent = `Próxima en ${left/60|0}:${String(left%60).padStart(2,'0')}`;
      if(left <= 0){ fire(); return; }
      later(tick, 1000);
    };
    tick();
  };
  const fire = () => {
    if(revealed){ revealed = false; cur = null; extra = 0; draw(); }
    const al = document.createElement('div'); al.className = 'alarm'; document.body.appendChild(al); setTimeout(() => al.remove(), 1400);
    buzz([300,100,300,100,300]);
    for(let k=0;k<6;k++) later(() => tone(k%2 ? 700 : 1000, .12, 'square', .1), k*150);
    const cd = $('#cd'); if(cd) cd.textContent = '¡CANCIÓN!';
    say('¡Atención! ¿Qué canción es?', {force:true});
    later(() => play(len), 1400);
  };
  stage.onclick = e => {
    const c = e.target.closest('[data-cat]'), l = e.target.closest('[data-len]'), v = e.target.closest('[data-ev]'), a = e.target.closest('[data-a]');
    if(c){ blip(); cat = c.dataset.cat; store('lp_scat', cat); deck = Deck(pool()); cur = null; nextP = null; revealed = false; stopAudio(); draw(); return; }
    if(l){ blip(); len = +l.dataset.len; store('lp_slen', len); stage.querySelectorAll('[data-len]').forEach(b => b.classList.toggle('on', b === l)); return; }
    if(v){ blip(); every = +v.dataset.ev; store('lp_sev', every); stage.querySelectorAll('[data-ev]').forEach(b => b.classList.toggle('on', b === v)); if(auto){ scheduleAuto(); } return; }
    if(e.target.closest('#disc')){ ac(); extra = 0; play(len); return; }
    if(!a) return;
    if(a.dataset.a === 'rep'){ extra = 0; play(len); }
    else if(a.dataset.a === 'more'){ extra++; play(len + extra); }
    else if(a.dataset.a === 'rev'){
      if(!revealed){ if(!cur) return; revealed = true; stopAudio(); tone(880,.2,'triangle',.1); showRev(); a.textContent = 'SIGUIENTE'; const d = $('#disc'); if(d && cur.art) d.innerHTML = `<img src="${esc(cur.art)}" alt="">`; const m = $('#smsg'); if(m) m.textContent = ''; say(`Era ${cur.title}, de ${cur.artist}.`); if(auto) scheduleAuto(); }
      else { revealed = false; cur = null; extra = 0; stopAudio(); draw(); ensure().catch(() => {}); if(auto) scheduleAuto(); }
    }
    else if(a.dataset.a === 'auto'){
      auto = !auto; a.classList.toggle('on', auto);
      if(auto){ ac(); try{ AUD.muted = true; AUD.play().catch(() => {}).finally(() => { AUD.pause(); AUD.muted = false; }); }catch(_){} wake(true); ensure().catch(() => {}); scheduleAuto(); }
      else { wake(false); const cd = $('#cd'); if(cd) cd.textContent = 'Apagado'; }
    }
  };
  S.cleanup.push(() => { auto = false; wake(false); });
  draw();
  ensure().catch(() => {});
}

/* ---------- arranque ---------- */
load('lp_18', false) ? home() : gate();
</script>
