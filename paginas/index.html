<style>
  .avisos { display:grid; gap:10px; margin:16px 0 4px; }
  .aviso { display:grid; gap:4px; padding:14px 16px; border-radius:14px; background:rgba(255,107,107,.10); border:1.5px solid var(--rojo); color:#FFFFFF; text-align:left; cursor:pointer; font:inherit; width:100%; }
  .aviso.ojo { background:rgba(233,185,73,.10); border-color:var(--oro); }
  .aviso .at { font-family:var(--tit); font-weight:600; letter-spacing:.06em; font-size:15px; color:var(--rojo); }
  .aviso.ojo .at { color:var(--oro); }
  .aviso .ax { font-size:14px; line-height:1.45; color:#FFFFFF; }
  .aviso .af { font-size:12px; color:#9FB0C8; }
  :root {
    color-scheme: dark;
    --bg:#07090D; --bg2:#0C1017; --card:#11161F; --card2:#171E2A; --line:#232B38; --line2:#323C4C;
    --tx:#EEF2F7; --mu:#97A1B2; --mu2:#667085;
    --oro:#E9B949; --oro2:#F7D27A; --oroink:#1A1204; --hielo:#A9D8F5; --hielo2:#6FB6E6; --rojo:#FF6B6B; --verde:#5FD49A;
    --tit:"Oswald","Arial Narrow",Impact,sans-serif; --txf:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: var(--txf); overflow-x: hidden; }
  body { min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(233,185,73,.13), transparent 60%),
      radial-gradient(700px 500px at -10% 10%, rgba(169,216,245,.10), transparent 60%),
      var(--bg); }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; }
  .env { max-width: 880px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
  h2.sec { font-family: var(--tit); font-weight: 600; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--mu);
    margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2.sec .lin { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
  h2.sec small { font-family: var(--txf); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--mu2); font-weight: 500; }
  h2.sec .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--oro); box-shadow: 0 0 12px var(--oro); }
  h2.sec.hielo .dot { background: var(--hielo); box-shadow: 0 0 12px var(--hielo); }
  .tbtn { appearance: none; border: 1px solid var(--line2); background: transparent; color: var(--mu); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--txf); letter-spacing: 0; text-transform: none; }
  .tbtn.on { background: var(--oro); color: var(--oroink); border-color: var(--oro); }

  /* ---------- cabecera ---------- */
  .cab { display: flex; align-items: center; gap: 12px; }
  .cab img { height: 34px; }
  .cab .marca { font-family: var(--tit); font-size: 13px; font-weight: 600; letter-spacing: .22em; color: var(--oro); }
  .cab .sp { flex: 1; }
  .icbtn { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 12px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; color: var(--tx); }
  .icbtn svg { width: 20px; height: 20px; }
  .icbtn:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }

  /* ---------- bloqueo ---------- */
  .bloq { min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .caja-fuerte { width: 150px; height: 150px; position: relative; }
  .caja-fuerte .r1, .caja-fuerte .r2 { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed rgba(233,185,73,.55); }
  .caja-fuerte .r2 { inset: 18px; border: 2px solid rgba(169,216,245,.35); border-top-color: var(--hielo); }
  .caja-fuerte .nucleo { position: absolute; inset: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--oro2), var(--oro) 55%, #8a6414); display: grid; place-items: center; box-shadow: 0 0 40px rgba(233,185,73,.35); }
  .caja-fuerte .nucleo svg { width: 30px; height: 30px; color: var(--oroink); }
  @media (prefers-reduced-motion: no-preference) {
    .caja-fuerte .r1 { animation: gira 22s linear infinite; }
    .caja-fuerte .r2 { animation: gira 3.5s linear infinite reverse; }
    .caja-fuerte.trabajando .r2 { animation-duration: .7s; }
  }
  @keyframes gira { to { transform: rotate(360deg); } }
  .bloq h1 { font-family: var(--tit); font-size: 44px; line-height: 1; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  .bloq h1 span { color: var(--oro); }
  .bloq p { margin: 0; color: var(--mu); font-size: 15px; max-width: 320px; }
  .campo { display: flex; gap: 8px; width: 100%; max-width: 340px; }
  input[type=password], input[type=search] { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); color: var(--tx); font-size: 16px; font-family: inherit; }
  input:focus { outline: 2px solid var(--oro); outline-offset: 1px; }
  .btn { appearance: none; border: 0; border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--txf); }
  .btn.oro { background: linear-gradient(135deg, var(--oro2), var(--oro)); color: var(--oroink); }
  .btn.fant { background: transparent; border: 1px solid var(--line2); color: var(--tx); }
  .btn:focus-visible { outline: 2px solid var(--hielo); outline-offset: 2px; }
  .error { color: var(--rojo); font-size: 14px; min-height: 20px; }

  /* ---------- hero ---------- */
  .hero { margin-top: 18px; border-radius: 24px; padding: 22px 20px 18px; position: relative; overflow: hidden;
    background: linear-gradient(150deg, #141B27 0%, #0D1219 60%, #161208 100%); border: 1px solid var(--line); }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(233,185,73,.28), transparent 65%); pointer-events: none; }
  .hero .hola { font-size: 13px; color: var(--hielo); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .hero h1 { font-family: var(--tit); font-weight: 700; text-transform: uppercase; font-size: clamp(38px, 10vw, 64px); line-height: .95; margin: 6px 0 0; letter-spacing: .01em; }
  .hero h1 span { color: var(--oro); }
  .maquina { margin-top: 12px; min-height: 44px; font-size: 15px; color: var(--tx); line-height: 1.45; position: relative; z-index: 1; }
  .maquina b { color: var(--oro2); font-weight: 600; }
  .cursor { display: inline-block; width: 2px; height: 1.05em; background: var(--oro); vertical-align: -2px; margin-left: 2px; }
  @media (prefers-reduced-motion: no-preference) { .cursor { animation: parp 1s steps(2) infinite; } }
  @keyframes parp { 50% { opacity: 0; } }
  .cifras { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
  .cifra { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; padding: 10px 8px; text-align: center; min-width: 0; }
  .cifra b { display: block; font-family: var(--tit); font-weight: 600; font-size: 26px; line-height: 1.05; color: var(--tx); font-variant-numeric: tabular-nums; }
  .cifra.oro b { color: var(--oro); } .cifra.hielo b { color: var(--hielo); }
  .cifra span { display: block; font-size: 10.5px; color: var(--mu); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acciones { display: flex; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
  .acciones .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 10px; }
  .acciones svg { width: 18px; height: 18px; }

  .buscar { position: relative; margin-top: 14px; }
  .buscar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--mu); }
  .buscar input { padding-left: 42px; }

  /* ---------- apps ---------- */
  .apps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .app { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; min-width: 0; }
  .app img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .app .n { font-family: var(--tit); font-size: 17px; font-weight: 600; letter-spacing: .03em; }
  .app .d { font-size: 12px; color: var(--mu); }

  /* ---------- destacadas ---------- */
  .dest { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 640px) { .dest { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .dtile { position: relative; appearance: none; border: 1px solid rgba(233,185,73,.35); border-radius: 18px; padding: 14px; text-align: left; cursor: pointer; min-height: 128px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 10px; overflow: hidden; color: var(--tx);
    background: linear-gradient(160deg, rgba(233,185,73,.16), rgba(233,185,73,.03) 55%), var(--card); }
  .dtile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,236,190,.18) 48%, transparent 66%); transform: translateX(-120%); pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) { .dtile::before { animation: brillo 6s ease-in-out infinite; } .dtile:nth-child(2)::before { animation-delay: 1.2s; } .dtile:nth-child(3)::before { animation-delay: 2.4s; } .dtile:nth-child(4)::before { animation-delay: 3.6s; } }
  @keyframes brillo { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
  .dtile .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .dtile .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(233,185,73,.16); color: var(--oro); flex: none; }
  .dtile .ic svg { width: 20px; height: 20px; }
  .dtile .n { font-weight: 600; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dtile .g { font-size: 11.5px; color: var(--mu); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dtile .x { font-family: var(--tit); font-size: 13px; color: var(--oro2); background: rgba(0,0,0,.35); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .orden { display: flex; gap: 6px; }
  .orden button { appearance: none; border: 1px solid var(--line2); background: var(--bg2); color: var(--tx); border-radius: 9px; width: 32px; height: 30px; cursor: pointer; display: grid; place-items: center; }
  .orden button svg { width: 16px; height: 16px; }
  .vacio { padding: 16px; color: var(--mu); font-size: 14px; text-align: center; background: var(--card); border: 1px dashed var(--line2); border-radius: 16px; line-height: 1.45; }
  .vacio b { color: var(--oro); }

  /* ---------- podio ---------- */
  .podio { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 8px; align-items: end; }
  .escalon { appearance: none; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; padding: 0; color: var(--tx); text-align: center; }
  .escalon .quien { font-size: 13px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 32px; }
  .escalon .barra { border-radius: 14px 14px 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 2px; position: relative; overflow: hidden; height: 0; }
  @media (prefers-reduced-motion: no-preference) { .escalon .barra { transition: height .9s cubic-bezier(.2,.9,.2,1.15); } }
  .escalon .pos { font-family: var(--tit); font-weight: 700; font-size: 30px; line-height: 1; }
  .escalon .veces { font-size: 12px; font-weight: 600; opacity: .8; }
  .e1 .barra { background: linear-gradient(180deg, var(--oro2), var(--oro) 40%, #7c5a12); color: var(--oroink); box-shadow: 0 0 30px rgba(233,185,73,.25); }
  .e2 .barra { background: linear-gradient(180deg, #E4F3FC, var(--hielo) 40%, #3f6d8c); color: #0b1a26; }
  .e3 .barra { background: linear-gradient(180deg, #F0C9A0, #C98B54 40%, #6b4222); color: #1e1006; }

  /* ---------- lista de uso ---------- */
  .ranking { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .rk { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .rk .p { font-family: var(--tit); color: var(--mu2); font-size: 16px; text-align: center; }
  .rk .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rk .bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .rk .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--hielo2), var(--hielo)); border-radius: 4px; }
  .rk .v { font-family: var(--tit); font-size: 15px; color: var(--hielo); }

  /* ---------- mapa de calor ---------- */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .calor { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
  .calor i { display: block; aspect-ratio: 1; border-radius: 4px; background: #182131; cursor: pointer; }
  .calor i.hoy { outline: 1.5px solid var(--oro); outline-offset: 1px; }
  .leyenda { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: var(--mu); gap: 10px; flex-wrap: wrap; }
  .leyenda .esc { display: flex; gap: 3px; align-items: center; }
  .leyenda .esc i { width: 11px; height: 11px; border-radius: 3px; display: block; }
  .horas { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; align-items: end; height: 70px; margin-top: 6px; }
  .horas i { display: block; background: linear-gradient(180deg, var(--oro2), var(--oro)); border-radius: 3px 3px 1px 1px; min-height: 2px; opacity: .9; }
  .horas i.cero { background: var(--line); }
  .horas-ej { position: relative; height: 16px; font-size: 11px; color: var(--mu2); margin-top: 4px; }
  .horas-ej span { position: absolute; top: 0; }
  .dos { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .dos { grid-template-columns: 1.4fr 1fr; } }
  .panel h3 { margin: 0 0 10px; font-family: var(--tit); font-weight: 500; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--mu); }

  /* ---------- carrusel ---------- */
  .carr { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .carr::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 150px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; appearance: none; color: var(--tx); }
  .mini .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .mini .ic svg { width: 19px; height: 19px; }
  .mini .n { font-size: 14px; font-weight: 500; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .g { font-size: 11.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- proyectos ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .proy { position: relative; appearance: none; border: 1px solid rgba(255,255,255,.06); cursor: pointer; text-align: left; border-radius: 20px; padding: 14px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: var(--tx); }
  .proy .emb { position: absolute; right: -16px; bottom: -18px; width: 100px; height: 100px; opacity: .16; }
  .proy .emb svg { width: 100%; height: 100%; }
  .proy .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; position: relative; }
  .proy .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
  .proy .ic svg { width: 21px; height: 21px; }
  .proy .num { font-size: 12px; font-weight: 600; background: rgba(0,0,0,.35); padding: 3px 8px; border-radius: 999px; }
  .proy .num.nuevo { background: var(--oro); color: var(--oroink); }
  .proy .n { position: relative; font-family: var(--tit); font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; }
  .proy .d { position: relative; font-size: 12px; color: var(--mu); margin-top: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .proy .uso { position: relative; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin-top: 10px; overflow: hidden; }
  .proy .uso i { display: block; height: 100%; border-radius: 4px; }

  /* ---------- vista proyecto ---------- */
  .volver { appearance: none; border: 0; background: transparent; color: var(--mu); font-size: 15px; font-weight: 600; padding: 6px 0; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 10px; }
  .volver svg { width: 18px; height: 18px; }
  .portada { margin-top: 8px; border-radius: 24px; padding: 20px; position: relative; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; border: 1px solid rgba(255,255,255,.07); }
  .portada .emb { position: absolute; right: -10px; top: -10px; width: 150px; height: 150px; opacity: .18; }
  .portada .emb svg { width: 100%; height: 100%; }
  .portada .s { position: relative; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); }
  .portada .n { position: relative; font-family: var(--tit); font-size: 34px; font-weight: 700; line-height: 1.02; text-transform: uppercase; }
  .portada .d { position: relative; font-size: 14px; color: var(--mu); }

  /* ---------- filas ---------- */
  .lista { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .fila { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; cursor: pointer; position: relative; }
  .fila.dest-on { border-color: rgba(233,185,73,.45); background: linear-gradient(90deg, rgba(233,185,73,.08), transparent 50%), var(--card); }
  .fila .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; position: relative; }
  .fila .ic svg { width: 21px; height: 21px; }
  .fila .t { font-size: 15px; font-weight: 600; line-height: 1.25; }
  .fila .q { font-size: 13px; color: var(--mu); margin-top: 3px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fila .m { font-size: 11px; color: var(--mu2); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fila .acc { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .estrella, .copiar { appearance: none; border: 0; background: transparent; cursor: pointer; width: 38px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--mu2); }
  .estrella svg, .copiar svg { width: 20px; height: 20px; }
  .estrella.on { color: var(--oro); }
  @media (prefers-reduced-motion: no-preference) { .estrella.pop svg { animation: pop .45s cubic-bezier(.2,1.6,.4,1); } }
  @keyframes pop { 0% { transform: scale(.4) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
  .estrella:focus-visible, .copiar:focus-visible, .fila:focus-visible, .proy:focus-visible, .mini:focus-visible, .dtile:focus-visible, .escalon:focus-visible, .rk:focus-visible, .app:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
  .chip { font-size: 10px; font-weight: 600; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; }
  .c-int { color: var(--rojo); border: 1px solid #6A2A2A; }

    for (var i = 0; i < 70; i++) ps.push({ x: W / 2, y: H * .32, vx: (Math.random() - .5) * 16 * devicePixelRatio, vy: (-Math.random() * 14 - 4) * devicePixelRatio, r: (Math.random() * 3 + 1.5) * devicePixelRatio, c: cols[i % 4], a: 1, g: .45 * devicePixelRatio });

    (function paso(t) {
      cx.clearRect(0, 0, W, H);
      ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.a -= .012; if (p.a > 0) { cx.globalAlpha = p.a; cx.fillStyle = p.c; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.3); cx.fill(); } });
      if (t - t0 < 1800) requestAnimationFrame(paso); else { cx.clearRect(0, 0, W, H); cv.hidden = true; }
    })(t0);
  }

  /* ---------- navegación ---------- */
  function ir(v, push) {
    VISTA = v; Q = ''; EDITAR = false; pintar(true); window.scrollTo(0, 0);
    if (push) try { history.pushState(v, '', v.tipo === 'proy' ? '#p' + v.g : '#'); } catch (e) {}
  }
  window.addEventListener('popstate', function (e) { VISTA = (e.state && e.state.tipo) ? e.state : { tipo: 'inicio' }; Q = ''; if (D) pintar(true); });

  /* ---------- toques ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-fav],[data-copiar],[data-proy],[data-volver],[data-instalar],[data-mover],[data-editar],[data-orden],[data-sorpresa],[data-sugerir],[data-otra],[data-dia],[data-url]') : null;
    if (!t) { if (ev.target.id === 'velo') $('velo').hidden = true; return; }
    if (t.hasAttribute('data-instalar')) {
      var instalada = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (esIOS && instalada) { ev.preventDefault(); location.href = 'x-safari-' + new URL(t.getAttribute('href'), location.href).toString(); }
      return;
    }
    ev.preventDefault();
    if (t.hasAttribute('data-fav')) {
      var u = t.getAttribute('data-fav'), f = favs(), i = f.indexOf(u);
      if (i >= 0) { f.splice(i, 1); aviso('Quitada de destacadas'); } else { f.push(u); aviso('Destacada: ya la tienes arriba, en oro'); }
      escribir(K_FAV, JSON.stringify(f));
      var enVelo = !$('velo').hidden;
      pintar();
      if (enVelo) { var est = $('velo').querySelector('.estrella'); if (est) { var on = f.indexOf(u) >= 0; est.className = 'estrella pop' + (on ? ' on' : ''); est.innerHTML = svg('estrella', on ? 1.2 : 1.9, on); } }
      else { var nueva = document.querySelector('.estrella[data-fav="' + CSS.escape(u) + '"]'); if (nueva) nueva.classList.add('pop'); }
      return;
    }
    if (t.hasAttribute('data-mover')) {
      var a = +t.getAttribute('data-mover'), d = +t.getAttribute('data-dir'), fl = favs().filter(function (x) { return POR_URL[x]; }), b = a + d;
      if (b < 0 || b >= fl.length) return; var tmp = fl[a]; fl[a] = fl[b]; fl[b] = tmp; escribir(K_FAV, JSON.stringify(fl)); pintar(); return;
    }
    if (t.hasAttribute('data-editar')) { EDITAR = !EDITAR; pintar(); return; }
    if (t.hasAttribute('data-orden')) { VISTA.orden = t.getAttribute('data-orden'); pintar(); return; }
    if (t.hasAttribute('data-sorpresa') || t.hasAttribute('data-otra')) { sorprender(); return; }
    if (t.hasAttribute('data-sugerir')) { sugerir(); return; }
    if (t.hasAttribute('data-dia')) {
      var k = t.getAttribute('data-dia'), lst = TODAS.filter(function (p) { return USO[p.url] && USO[p.url].d && USO[p.url].d[k]; }).map(function (p) { return p.titulo; });
      $('dia-info').textContent = fecha(k) + ': ' + (lst.length ? lst.slice(0, 3).join(', ') + (lst.length > 3 ? ' y ' + (lst.length - 3) + ' más' : '') : 'nada');
      return;
    }
    if (t.hasAttribute('data-copiar')) {
      var c = t.getAttribute('data-copiar');
      (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { aviso('Enlace copiado'); }, function () { window.prompt('Copia el enlace:', c); });
      return;
    }
    if (t.hasAttribute('data-proy')) { ir({ tipo: 'proy', g: +t.getAttribute('data-proy') }, true); return; }
    if (t.hasAttribute('data-volver')) { if (history.state && history.state.tipo === 'proy') history.back(); else ir({ tipo: 'inicio' }, true); return; }
    if (t.hasAttribute('data-url')) { if (t.hasAttribute('data-cerrar')) $('velo').hidden = true; if (EDITAR && t.classList.contains('dtile')) return; abrirFuera(t.getAttribute('data-url')); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('velo').hidden) { $('velo').hidden = true; return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.hasAttribute('data-url')) { ev.preventDefault(); abrirFuera(ev.target.getAttribute('data-url')); }
    if (ev.key === '/' && document.activeElement && document.activeElement.tagName !== 'INPUT' && $('buscar')) { ev.preventDefault(); $('buscar').focus(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && D && !Q) pintar(); });

  /* ---------- arrancar ---------- */
  function abrir(datos, recienDesbloqueado) {
    preparar(datos); sembrar(); DIAS = marcarDia();
    $('bloqueado').hidden = true; $('abierto').hidden = false;
    $('ver-viejos').checked = verViejos();
    $('ver-viejos').onchange = function () { escribir(K_VIE, this.checked ? '1' : '0'); pintar(); };
    $('op-safari').hidden = !esIOS;
    $('forzar-safari').checked = forzarSafari();
    $('forzar-safari').onchange = function () { escribir(K_SAF, this.checked ? '1' : '0'); };
    $('borrar-uso').onclick = function (e) { e.preventDefault(); if (window.confirm('¿Poner a cero el contador de este móvil? Tus destacadas se quedan.')) { USO = {}; guardarUso(); escribir(K_REC, '[]'); pintar(true); aviso('Contador a cero'); } };
    var total = TODAS.length;
    $('pie').innerHTML = '<b>' + total + ' páginas en ' + D.grupos.length + ' proyectos</b> · lista del ' + fecha(D.actualizado) +
      '. Solo se abren con tu cuenta de Claude. El contador y las destacadas se guardan en este móvil. ' +
      '<a href="#" id="salir" style="color:#97A1B2">Olvidar el código en este móvil</a>';
    $('salir').onclick = function (e) { e.preventDefault(); e.stopPropagation(); escribir(K_COD, null); location.reload(); };
    var m = /^#p(\d+)$/.exec(location.hash || '');
    VISTA = m ? { tipo: 'proy', g: +m[1] } : { tipo: 'inicio' };
    try { history.replaceState(VISTA, '', location.hash || '#'); } catch (e) {}
    pintar(true);
    if (recienDesbloqueado) chispas();
  }

  if (window.__LZ_PRUEBA) { abrir(window.__LZ_PRUEBA, true); return; }
  fetch('../paginas.enc.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('No encuentro la lista (' + r.status + ')');
    return r.json();
  }).then(function (sobre) {
    function intentar(cod, callado) {
      $('cf').classList.add('trabajando');
      return descifrar(sobre, cod).then(function (d) { escribir(K_COD, cod); abrir(d, !callado); },
        function () { $('cf').classList.remove('trabajando'); escribir(K_COD, null); $('bloqueado').hidden = false; if (!callado) $('error').textContent = 'Ese código no es.'; });
    }
    $('entrar').onclick = function () { var c = $('codigo').value.trim(); if (c) { $('error').textContent = ''; intentar(c); } };
    $('codigo').onkeydown = function (e) { if (e.key === 'Enter') $('entrar').onclick(); };
    var guardado = leer(K_COD);
    if (guardado) intentar(guardado, true); else $('bloqueado').hidden = false;
  }).catch(function (e) {
    $('bloqueado').hidden = false;
    $('error').textContent = 'No se ha podido cargar la lista: ' + e.message + '. Comprueba la conexión.';
  });
})();
</script>
