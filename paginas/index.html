<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
  :root { color-scheme: dark; --bg:#0A0A0B; --card:#141416; --card2:#1B1B1E; --line:#26262A; --tx:#F2F2F2; --mu:#9C9CA3; --mu2:#6F6F76; --oro:#F7AF35; --rojo:#FF6B6B; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--tx);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; }
  .env { max-width: 760px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }

  /* cabecera */
  .cab { display: flex; align-items: center; gap: 12px; }
  .cab img { height: 40px; }
  .cab .t1 { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--tx); }
  .cab .t2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; color: var(--tx); line-height: 1.1; }
  .cab .t2 span { color: var(--oro); }
  .cab .sp { flex: 1; }
  .icbtn { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 12px; width: 42px; height: 42px;
    display: grid; place-items: center; cursor: pointer; }
  .icbtn svg { width: 20px; height: 20px; }

  .buscar { position: relative; margin-top: 16px; }
  .buscar svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--mu); }
  input[type=search], input[type=password] { width: 100%; padding: 13px 14px 13px 40px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--tx); font-size: 16px; font-family: inherit; }
  input[type=password] { padding-left: 14px; }
  input:focus { outline: 2px solid var(--oro); outline-offset: 1px; }

  h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mu); margin: 26px 0 10px; font-weight: 800;
    display: flex; align-items: baseline; justify-content: space-between; }
  h2 small { font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--mu2); font-weight: 600; }

  /* apps */
  .apps { display: flex; gap: 10px; }
  .app { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--line); text-decoration: none; min-width: 0; }
  .app img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .app .n { font-size: 15px; font-weight: 800; }
  .app .d { font-size: 12px; color: var(--mu); }

  /* carrusel */
  .carr { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .carr::-webkit-scrollbar { display: none; }
  .mini { flex: none; width: 150px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; appearance: none; }
  .mini .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
  .mini .ic svg { width: 19px; height: 19px; }
  .mini .n { font-size: 14px; font-weight: 700; line-height: 1.25; color: var(--tx);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini .g { font-size: 11.5px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* proyectos */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .proy { position: relative; appearance: none; border: 0; cursor: pointer; text-align: left; border-radius: 20px; padding: 14px;
    min-height: 138px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: #0B0B0B; }
  .proy .emb { position: absolute; right: -14px; bottom: -16px; width: 96px; height: 96px; opacity: .22; }
  .proy .emb svg { width: 100%; height: 100%; }
  .proy .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; position: relative; }
  .proy .ic { width: 38px; height: 38px; border-radius: 12px; background: rgba(0,0,0,.18); display: grid; place-items: center; }
  .proy .ic svg { width: 21px; height: 21px; }
  .proy .num { font-size: 12px; font-weight: 800; background: rgba(0,0,0,.2); padding: 3px 8px; border-radius: 999px; }
  .proy .num.nuevo { background: #0B0B0B; color: #fff; }
  .proy .nw { position: absolute; top: -4px; right: -4px; width: 10px; height: 10px; border-radius: 50%; background: #0B0B0B; box-shadow: 0 0 0 2px rgba(255,255,255,.65); }
  .proy .n { position: relative; font-size: 16px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
  .proy .d { position: relative; font-size: 12px; font-weight: 600; opacity: .72; margin-top: 3px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .proy:focus-visible, .mini:focus-visible, .fila:focus-visible, .app:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }

  /* vista proyecto */
  .volver { appearance: none; border: 0; background: transparent; color: var(--mu); font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .volver svg { width: 18px; height: 18px; }
  .portada { margin-top: 8px; border-radius: 24px; padding: 20px; color: #0B0B0B; position: relative; overflow: hidden; min-height: 150px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
  .portada .emb { position: absolute; right: -10px; top: -10px; width: 150px; height: 150px; opacity: .2; }
  .portada .emb svg { width: 100%; height: 100%; }
  .portada .s { position: relative; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .portada .n { position: relative; font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .portada .d { position: relative; font-size: 14px; font-weight: 600; opacity: .75; }

  .lista { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .fila { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px; cursor: pointer; }
  .fila .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
  .fila .ic svg { width: 21px; height: 21px; }
  .fila .t { font-size: 15px; font-weight: 700; color: var(--tx); line-height: 1.25; }
  .fila .q { font-size: 13px; color: var(--mu); margin-top: 3px; line-height: 1.35; }
  .fila .m { font-size: 11px; color: var(--mu2); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fila .acc { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .estrella, .copiar { appearance: none; border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--mu2); }
  .estrella svg, .copiar svg { width: 19px; height: 19px; }
  .estrella.on { color: var(--oro); }
  .estrella:focus-visible, .copiar:focus-visible { outline: 2px solid var(--oro); }
  .marca { font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 6px; border-radius: 6px; }
  .m-int { color: var(--rojo); border: 1px solid #6A2A2A; }
  .m-ens { color: var(--oro); border: 1px solid #6B4A12; }
  .m-vie { color: #8A8A8A; border: 1px solid #3A3A3A; }
  .m-new { color: #0B0B0B; background: var(--oro); }
  .vacio { padding: 18px; color: var(--mu); font-size: 14px; text-align: center; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }

  .caja { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; font-size: 15px; line-height: 1.5; }
  .btn { appearance: none; border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .principal { background: var(--oro); color: #0B0B0B; }
  .error { color: var(--rojo); font-size: 14px; margin-top: 10px; min-height: 20px; }
  .ajustes { margin-top: 26px; font-size: 13px; color: var(--mu); display: flex; flex-direction: column; gap: 12px; }
  .ajustes label { display: flex; gap: 10px; align-items: center; }
  .ajustes input { accent-color: var(--oro); width: 17px; height: 17px; flex: none; }
  .pie { margin-top: 18px; font-size: 12px; line-height: 1.5; color: var(--mu2); }
  .pie b { color: var(--mu); }
  #aviso { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--oro); color: #0B0B0B; font-weight: 700; font-size: 14px; padding: 10px 16px; border-radius: 12px; z-index: 9; }
  @media (prefers-reduced-motion: no-preference) { .proy, .fila, .mini { transition: transform .12s ease; } .proy:active, .fila:active, .mini:active { transform: scale(.98); } }
</style>
</head>
<body>
<div class="env">
  <div class="cab">
    <img src="../iconos/logo_oro.svg" alt="">
    <div><div class="t1">GOLDEN OCLOCK</div><div class="t2">Páginas<span>.</span></div></div>
    <div class="sp"></div>
  </div>

  <div id="bloqueado" hidden>
    <h2>Entrar</h2>
    <div class="caja">
      Escribe el código de tus páginas. Solo se pide una vez en cada móvil.
      <div style="margin-top:12px"><input type="password" id="codigo" placeholder="Código" autocomplete="current-password" autocapitalize="off"></div>
      <div style="margin-top:12px"><button class="btn principal" id="entrar" type="button">Entrar</button></div>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="abierto" hidden>
    <div class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="buscar" placeholder="Buscar en todas las páginas" autocomplete="off">
    </div>
    <div id="vista"></div>
    <div class="ajustes" id="ajustes">
      <label><input type="checkbox" id="ver-viejos"> Enseñar también las antiguas o de un solo uso</label>
      <label id="op-safari"><input type="checkbox" id="forzar-safari"> Abrir las páginas en Safari (recomendado en el iPhone: ahí tienes la sesión de Claude)</label>
    </div>
    <div class="pie" id="pie"></div>
  </div>
</div>
<div id="aviso" hidden></div>

<script>
(function () {
  'use strict';
  var K_COD = 'lz_paginas_codigo', K_VIE = 'lz_paginas_viejos', K_SAF = 'lz_paginas_safari', K_FAV = 'lz_paginas_favs', K_REC = 'lz_paginas_recientes';
  function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function escribir(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function leerJ(k, d) { try { return JSON.parse(leer(k)) || d; } catch (e) { return d; } }
  function $(id) { return document.getElementById(id); }
  var ua = navigator.userAgent || '';
  var esIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fecha(f) { if (!f) return ''; var p = f.split('-'); return p.length === 3 ? p[2] + '/' + p[1] : f; }
  function dias(f) { if (!f) return 999; var t = Date.parse(f + 'T12:00:00'); return isNaN(t) ? 999 : Math.floor((Date.now() - t) / 864e5); }
  function aviso(t) { var a = $('aviso'); a.textContent = t; a.hidden = false; clearTimeout(aviso._t); aviso._t = setTimeout(function () { a.hidden = true; }, 1800); }

  /* ---------- iconos (trazo, 24x24) ---------- */
  var P = {
    reloj: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    grafica: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
    diamante: '<path d="M6 4h12l4 5-10 11L2 9z"/><path d="M2 9h20M9 4l3 16 3-16"/>',
    pulso: '<path d="M3 12h4l2-5 4 10 2-5h6"/>',
    coche: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="16" r="1"/><circle cx="16.5" cy="16" r="1"/>',
    llave: '<path d="M14.5 6.5a4 4 0 0 0 4.9 5L21 13l-8 8-3-3 8-8-.6-1.5a4 4 0 0 1-2.9-2z"/><path d="M3 21l7-7"/>',
    engranaje: '<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    gota: '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
    casa: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
    mando: '<path d="M7 8h10a5 5 0 0 1 4.8 6.4l-.8 2.7a2 2 0 0 1-3.4.8L15 15H9l-2.6 2.9a2 2 0 0 1-3.4-.8l-.8-2.7A5 5 0 0 1 7 8z"/><path d="M8 11v3M6.5 12.5h3M15.5 12h.01M17.5 13.5h.01"/>',
    carpeta: '<path d="M3 7h6l2 2h10v10H3z"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    caja: '<path d="M3 8 12 4l9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8M12 12v8"/>',
    euro: '<path d="M17 6a7 7 0 1 0 0 12"/><path d="M4 10h9M4 14h9"/>',
    lupa: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
    mapa: '<path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
    bolsa: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    tienda: '<path d="M4 9h16l-1-5H5z"/><path d="M5 9v11h14V9M10 20v-5h4v5"/>',
    cartas: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',
    ruta: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/>',
    tele: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',
    hoja: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>',
    estrella: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    copiar: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',
    atras: '<path d="m15 18-6-6 6-6"/>',
    presentar: '<path d="M4 5h16v11H4z"/><path d="M12 16v4M8 20h8"/>'
  };
  function svg(n, extra) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (extra || 1.9) + '" stroke-linecap="round" stroke-linejoin="round">' + (P[n] || P.carpeta) + '</svg>'; }

  /* De qué va cada página, por su título */
  var TIPOS = [
    [/parte/i, 'doc'], [/stock/i, 'caja'], [/finanz|cobro|dinero/i, 'euro'], [/auditor|radiograf|frente a/i, 'lupa'],
    [/plan|hoja de ruta|trato|continuidad/i, 'mapa'], [/cat[aá]logo|caza|cadenas|colgantes/i, 'bolsa'], [/tienda|web/i, 'tienda'],
    [/marca|logo|joyer[ií]a con/i, 'diamante'], [/mesa|decisor/i, 'cartas'], [/ruta|reparto/i, 'ruta'], [/kit|manual|doc|c[oó]mo trabajo/i, 'doc'],
    [/tele|panel|dashboard/i, 'tele'], [/crm|hoja/i, 'hoja'], [/presentaci|proyecto/i, 'presentar'], [/recuperador|clientes/i, 'pulso']
  ];
  function tipo(p, g) { if (p.icono) return p.icono; if (g && g.icono === 'mando') return 'mando'; for (var i = 0; i < TIPOS.length; i++) if (TIPOS[i][0].test(p.titulo)) return TIPOS[i][1]; return 'hoja'; }

  var PALETA = ['#F7AF35', '#8CC8F0', '#5FC7A8', '#9B8CFF', '#F09AB8', '#E8C25A', '#7FA7D9', '#FF7A59', '#C9A27A'];
  function colorDe(g) { if (g.color) return g.color; var h = 0; for (var i = 0; i < g.nombre.length; i++) h = (h * 31 + g.nombre.charCodeAt(i)) >>> 0; return PALETA[h % PALETA.length]; }
  function suave(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function fondo(c) { return 'background:linear-gradient(145deg,' + c + ' 0%,' + suave(c, .78) + ' 100%)'; }

  /* ---------- abrir fuera ---------- */
  function forzarSafari() { var v = leer(K_SAF); return v == null ? esIOS : v === '1'; }
  function abrirFuera(url) {
    var rec = leerJ(K_REC, []).filter(function (u) { return u !== url; }); rec.unshift(url); escribir(K_REC, JSON.stringify(rec.slice(0, 12)));
    if (esIOS && forzarSafari()) { location.href = 'x-safari-' + url; return; }
    window.open(url, '_blank', 'noopener');
  }

  /* ---------- descifrar ---------- */
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function descifrar(sobre, codigo) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(codigo), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(sobre.sal), iterations: sobre.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (clave) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(sobre.iv) }, clave, b64(sobre.datos)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  /* ---------- datos ---------- */
  var D = null, TODAS = [], VISTA = { tipo: 'inicio' };
  function verViejos() { return leer(K_VIE) === '1'; }
  function favs() { return leerJ(K_FAV, []); }
  function esNueva(p) { return dias(p.fecha) <= 1; }
  function preparar(datos) {
    D = datos; TODAS = [];
    D.grupos.forEach(function (g, gi) {
      g._i = gi; g._c = colorDe(g);
      g.paginas.forEach(function (p) { p._g = g; TODAS.push(p); });
    });
    (D.herramientas || []).forEach(function (p) { p._g = { nombre: 'Herramientas', _c: '#9C9CA3', icono: 'hoja', _i: -1 }; TODAS.push(p); });
  }
  function visibles(g) { return g.paginas.filter(function (p) { return verViejos() || !p.viejo; }); }
  function ultima(g) { return g.paginas.reduce(function (m, p) { return (p.fecha || '') > m ? p.fecha : m; }, ''); }

  /* ---------- piezas ---------- */
  function marcas(p) {
    return (esNueva(p) ? '<span class="marca m-new">NUEVA</span>' : '') +
      (p.interno ? '<span class="marca m-int">INTERNO</span>' : '') +
      (p.ensenar ? '<span class="marca m-ens">PARA ENSEÑAR</span>' : '') +
      (p.viejo ? '<span class="marca m-vie">ANTIGUA</span>' : '');
  }
  function fila(p, conGrupo) {
    var c = p._g._c, on = favs().indexOf(p.url) >= 0;
    return '<div class="fila" role="button" tabindex="0" data-url="' + esc(p.url) + '">' +
      '<div class="ic" style="background:' + suave(c, .16) + ';color:' + c + '">' + svg(tipo(p, p._g)) + '</div>' +
      '<div><div class="t">' + esc(p.titulo) + '</div>' + (p.que ? '<div class="q">' + esc(p.que) + '</div>' : '') +
      '<div class="m">' + (conGrupo ? '<span style="color:' + c + ';font-weight:700">' + esc(p._g.nombre) + '</span>' : '') +
      (p.fecha ? '<span>' + fecha(p.fecha) + '</span>' : '') + marcas(p) + '</div></div>' +
      '<div class="acc"><button class="estrella' + (on ? ' on' : '') + '" type="button" data-fav="' + esc(p.url) + '" aria-label="' + (on ? 'Quitar de favoritas' : 'Marcar como favorita') + '">' + svg('estrella', on ? 0 : 1.9).replace('fill="none"', on ? 'fill="currentColor"' : 'fill="none"') + '</button>' +
      '<button class="copiar" type="button" data-copiar="' + esc(p.url) + '" aria-label="Copiar enlace">' + svg('copiar') + '</button></div></div>';
  }
  function mini(p) {
    var c = p._g._c;
    return '<button class="mini" type="button" data-url="' + esc(p.url) + '"><div class="ic" style="background:' + suave(c, .16) + ';color:' + c + '">' + svg(tipo(p, p._g)) + '</div>' +
      '<div class="n">' + esc(p.titulo) + '</div><div class="g">' + esc(p._g.nombre) + '</div></button>';
  }
  function carrusel(titulo, ps, nota) { if (!ps.length) return ''; return '<h2>' + titulo + (nota ? '<small>' + nota + '</small>' : '') + '</h2><div class="carr">' + ps.map(mini).join('') + '</div>'; }

  /* ---------- vistas ---------- */
  function inicio() {
    var h = '<h2>Apps</h2><div class="apps">' +
      '<a class="app" href="../app/" data-instalar><img src="../iconos/icono_app_180.png" alt=""><div><div class="n">GOLDEN</div><div class="d">La APP</div></div></a>' +
      '<a class="app" href="../reparto/" data-instalar><img src="../iconos/icono_reparto_180.png" alt=""><div><div class="n">Reparto</div><div class="d">Entregas</div></div></a></div>';
    var porUrl = {}; TODAS.forEach(function (p) { porUrl[p.url] = p; });
    var fv = favs().map(function (u) { return porUrl[u]; }).filter(Boolean);
    h += carrusel('Favoritas', fv, '');
    var nuevas = TODAS.filter(function (p) { return !p.viejo && esNueva(p); }).sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });
    h += carrusel('Nuevas', nuevas, 'hoy y ayer');
    var rec = leerJ(K_REC, []).map(function (u) { return porUrl[u]; }).filter(Boolean).slice(0, 8);
    h += carrusel('Abiertas hace poco', rec, '');
    if (!fv.length) h += '<p class="pie" style="margin-top:10px">Toca la estrella de una página para tenerla aquí arriba.</p>';

    var secciones = [], porSec = {};
    D.grupos.forEach(function (g) { var s = g.seccion || 'Otros'; if (!porSec[s]) { porSec[s] = []; secciones.push(s); } porSec[s].push(g); });
    secciones.forEach(function (s) {
      h += '<h2>' + esc(s) + '<small>' + porSec[s].length + (porSec[s].length === 1 ? ' proyecto' : ' proyectos') + '</small></h2><div class="grid">';
      porSec[s].forEach(function (g) {
        var n = visibles(g).length, hayNueva = g.paginas.some(function (p) { return !p.viejo && esNueva(p); });
        h += '<button class="proy" type="button" data-proy="' + g._i + '" style="' + fondo(g._c) + '">' +
          '<div class="emb">' + svg(g.icono || 'carpeta', 1.4) + '</div>' +
          '<div class="top"><div class="ic">' + svg(g.icono || 'carpeta') + '</div><div class="num' + (hayNueva ? ' nuevo' : '') + '">' + n + (hayNueva ? ' · nuevo' : '') + '</div></div>' +
          '<div><div class="n">' + esc(g.nombre) + '</div>' + (g.nota ? '<div class="d">' + esc(g.nota) + '</div>' : '') + '</div></button>';
      });
      h += '</div>';
    });
    if (D.herramientas && D.herramientas.length) h += '<h2>Herramientas</h2><div class="lista">' + D.herramientas.map(function (p) { return fila(p, false); }).join('') + '</div>';
    return h;
  }
  function proyecto(gi) {
    var g = D.grupos[gi]; if (!g) return inicio();
    var ps = visibles(g).slice().sort(function (a, b) { return (!!a.viejo - !!b.viejo) || (b.fecha || '').localeCompare(a.fecha || ''); });
    var ocultas = g.paginas.length - ps.length;
    return '<button class="volver" type="button" data-volver>' + svg('atras', 2.2) + 'Proyectos</button>' +
      '<div class="portada" style="' + fondo(g._c) + '"><div class="emb">' + svg(g.icono || 'carpeta', 1.2) + '</div>' +
      '<div class="s">' + esc(g.seccion || 'Proyecto') + ' · ' + ps.length + ' páginas' + (ultima(g) ? ' · última ' + fecha(ultima(g)) : '') + '</div>' +
      '<div class="n">' + esc(g.nombre) + '</div>' + (g.nota ? '<div class="d">' + esc(g.nota) + '</div>' : '') + '</div>' +
      '<div class="lista">' + (ps.length ? ps.map(function (p) { return fila(p, false); }).join('') : '<div class="vacio">No hay páginas activas.</div>') + '</div>' +
      (ocultas ? '<p class="pie">' + ocultas + (ocultas === 1 ? ' página antigua escondida' : ' páginas antiguas escondidas') + '. Actívalas abajo en «Enseñar también las antiguas».</p>' : '');
  }
  function busqueda(q) {
    var t = q.toLowerCase();
    var ps = TODAS.filter(function (p) { return (p.titulo + ' ' + (p.que || '') + ' ' + p._g.nombre).toLowerCase().indexOf(t) >= 0; })
      .sort(function (a, b) { return (!!a.viejo - !!b.viejo) || (b.fecha || '').localeCompare(a.fecha || ''); });
    return '<h2>Resultados<small>' + ps.length + '</small></h2><div class="lista">' +
      (ps.length ? ps.map(function (p) { return fila(p, true); }).join('') : '<div class="vacio">No hay ninguna página con «' + esc(q) + '».</div>') + '</div>';
  }
  function pintar() {
    var q = ($('buscar').value || '').trim();
    var html = q ? busqueda(q) : VISTA.tipo === 'proy' ? proyecto(VISTA.g) : inicio();
    $('vista').innerHTML = html;
    $('ajustes').hidden = !!q;
  }
  function ir(v, push) {
    VISTA = v; $('buscar').value = ''; pintar(); window.scrollTo(0, 0);
    if (push) try { history.pushState(v, '', v.tipo === 'proy' ? '#p' + v.g : '#'); } catch (e) {}
  }
  window.addEventListener('popstate', function (e) { VISTA = (e.state && e.state.tipo) ? e.state : { tipo: 'inicio' }; if (D) pintar(); });

  /* ---------- toques ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest ? ev.target.closest('[data-fav],[data-copiar],[data-proy],[data-volver],[data-instalar],[data-url]') : null;
    if (!t) return;
    if (t.hasAttribute('data-instalar')) {
      var instalada = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (esIOS && instalada) { ev.preventDefault(); location.href = 'x-safari-' + new URL(t.getAttribute('href'), location.href).toString(); }
      return;
    }
    ev.preventDefault();
    if (t.hasAttribute('data-fav')) {
      var u = t.getAttribute('data-fav'), f = favs(), i = f.indexOf(u);
      if (i >= 0) { f.splice(i, 1); aviso('Quitada de favoritas'); } else { f.unshift(u); aviso('Añadida a favoritas'); }
      escribir(K_FAV, JSON.stringify(f)); pintar(); return;
    }
    if (t.hasAttribute('data-copiar')) {
      var c = t.getAttribute('data-copiar');
      (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { aviso('Enlace copiado'); },
        function () { window.prompt('Copia el enlace:', c); });
      return;
    }
    if (t.hasAttribute('data-proy')) { ir({ tipo: 'proy', g: +t.getAttribute('data-proy') }, true); return; }
    if (t.hasAttribute('data-volver')) { if (history.state && history.state.tipo === 'proy') history.back(); else ir({ tipo: 'inicio' }, true); return; }
    if (t.hasAttribute('data-url')) abrirFuera(t.getAttribute('data-url'));
  });
  document.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('fila')) { ev.preventDefault(); abrirFuera(ev.target.getAttribute('data-url')); } });

  function abrir(datos) {
    preparar(datos);
    $('bloqueado').hidden = true; $('abierto').hidden = false;
    $('ver-viejos').checked = verViejos();
    $('ver-viejos').onchange = function () { escribir(K_VIE, this.checked ? '1' : '0'); pintar(); };
    $('op-safari').hidden = !esIOS;
    $('forzar-safari').checked = forzarSafari();
    $('forzar-safari').onchange = function () { escribir(K_SAF, this.checked ? '1' : '0'); };
    $('buscar').oninput = pintar;
    var total = TODAS.length;
    $('pie').innerHTML = '<b>' + total + ' páginas en ' + D.grupos.length + ' proyectos</b> · lista del ' + fecha(D.actualizado) +
      '. Solo se abren con tu cuenta de Claude. Si Safari te pide entrar, entra una vez en claude.ai y ya queda.' +
      ' · <a href="#" id="salir" style="color:#9C9CA3">Olvidar el código en este móvil</a>';
    $('salir').onclick = function (e) { e.preventDefault(); e.stopPropagation(); escribir(K_COD, null); location.reload(); };
    var m = /^#p(\d+)$/.exec(location.hash || '');
    VISTA = m ? { tipo: 'proy', g: +m[1] } : { tipo: 'inicio' };
    try { history.replaceState(VISTA, '', location.hash || '#'); } catch (e) {}
    pintar();
  }

  if (window.__LZ_PRUEBA) { abrir(window.__LZ_PRUEBA); return; }
  fetch('../paginas.enc.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('No encuentro la lista (' + r.status + ')');
    return r.json();
  }).then(function (sobre) {
    function intentar(cod, callado) {
      return descifrar(sobre, cod).then(function (d) { escribir(K_COD, cod); abrir(d); },
        function () { escribir(K_COD, null); $('bloqueado').hidden = false; if (!callado) $('error').textContent = 'Ese código no es.'; });
    }
    $('entrar').onclick = function () { var c = $('codigo').value.trim(); if (c) { $('error').textContent = ''; intentar(c); } };
    $('codigo').onkeydown = function (e) { if (e.key === 'Enter') $('entrar').onclick(); };
    var guardado = leer(K_COD);
    if (guardado) intentar(guardado, true); else $('bloqueado').hidden = false;
  }).catch(function (e) {
    $('bloqueado').hidden = false;
    $('error').textContent = 'No se ha podido cargar la lista: ' + e.message + '. Comprueba la conexión.';
  });
})();
</script>
</body>
</html>
