<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Leads Linktree</title>
<style>
  :root {
    --papel: #F7F3E9;      /* fondo crema, distinto de las demás páginas */
    --tinta: #22306B;      /* azul tinta de pluma */
    --tinta2: #5A648F;
    --verde: #116B4A;
    --rojo: #B4232A;
    --oro: #B8860B;
    --carta: #FFFFFF;
    --borde: #D9D0BA;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    background: var(--papel); color: var(--tinta);
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 0 70px 0;
  }
  header {
    background: #22306B; color: #F7F3E9; padding: 14px 16px 10px;
    border-bottom: 4px solid #B8860B;
  }
  header h1 { color: #F7F3E9; font: 700 20px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .3px; }
  header .sub { color: #C9CFE8; font-size: 12.5px; margin-top: 2px; }
  nav {
    display: flex; gap: 6px; padding: 10px 12px; position: sticky; top: 0; z-index: 5;
    background: #F7F3E9; border-bottom: 1px solid #D9D0BA; overflow-x: auto;
  }
  nav button {
    flex: 0 0 auto; border: 1.5px solid #22306B; background: #FFFFFF; color: #22306B;
    border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13.5px;
  }
  nav button.on { background: #22306B; color: #F7F3E9; }
  main { padding: 12px 12px 0; max-width: 760px; margin: 0 auto; }
  .carta {
    background: #FFFFFF; border: 1px solid #D9D0BA; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(34,48,107,.06);
  }
  .fila { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nom { color: #22306B; font-weight: 800; font-size: 16.5px; }
  .tel { color: #5A648F; font-size: 13px; }
  .chip { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .chip.seg { background: #E8EEF9; color: #22306B; }
  .chip.var { background: #FBF3DC; color: #8A6508; }
  .msg { color: #44507E; font-size: 13.5px; margin: 8px 0; background: #FBF9F2; border-left: 3px solid #B8860B; padding: 7px 9px; border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  .acciones button, .acciones a {
    border: 1.5px solid #D9D0BA; background: #FFFFFF; color: #22306B; border-radius: 10px;
    padding: 8px 10px; font-weight: 700; font-size: 13px; text-decoration: none; text-align: center;
  }
  a.wa { background: #116B4A; border-color: #116B4A; color: #FFFFFF; flex: 1 1 110px; }
  button.hecho.on { background: #22306B; border-color: #22306B; color: #FFFFFF; }
  button.resp.on { background: #B8860B; border-color: #B8860B; color: #FFFFFF; }
  button.venta.on { background: #116B4A; border-color: #116B4A; color: #FFFFFF; }
  button.baja.on { background: #B4232A; border-color: #B4232A; color: #FFFFFF; }
  .carta.esta-baja { opacity: .55; border-color: #B4232A; }
  .diaBarra { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
  .diaBarra button { border: 1.5px solid #22306B; background: #FFFFFF; color: #22306B; border-radius: 10px; padding: 8px 12px; font-weight: 800; }
  .diaBarra select { flex: 1; min-width: 0; border: 1.5px solid #22306B; border-radius: 10px; padding: 8px; font-weight: 700; color: #22306B; background: #FFFFFF; font-size: 14px; }
  .progreso { height: 10px; background: #E7E0CC; border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .progreso div { height: 100%; background: #116B4A; }
  .resumenDia { color: #5A648F; font-size: 13px; margin-bottom: 10px; }
  h2 { color: #22306B; font: 700 17px Georgia, serif; margin: 14px 0 8px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .kpi { background: #FFFFFF; border: 1px solid #D9D0BA; border-radius: 12px; padding: 10px; }
  .kpi b { display: block; color: #22306B; font-size: 21px; }
  .kpi span { color: #5A648F; font-size: 12px; }
  .nota { color: #44507E; font-size: 13.5px; background: #FFFFFF; border: 1px solid #D9D0BA; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .nota b { color: #22306B; }
  svg text { font-family: -apple-system, "Segoe UI", sans-serif; }
  .grafico { background: #FFFFFF; border: 1px solid #D9D0BA; border-radius: 12px; padding: 8px; margin-bottom: 10px; }
  .grafico svg { width: 100%; height: auto; display: block; }
  .pie { position: fixed; left: 0; right: 0; bottom: 0; background: #22306B; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .pie button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-weight: 800; background: #B8860B; color: #FFFFFF; font-size: 14px; }
  .pie button.sec { background: #3A477F; color: #F7F3E9; }
  #gate { padding: 40px 20px; max-width: 360px; margin: 0 auto; text-align: center; }
  #gate h2 { color: #22306B; margin-bottom: 6px; }
  #gate p { color: #5A648F; font-size: 14px; margin-bottom: 14px; }
  #pin { width: 160px; font-size: 28px; text-align: center; letter-spacing: 10px; border: 2px solid #22306B; border-radius: 12px; padding: 8px; color: #22306B; background: #FFFFFF; }
  #gate button { display: block; margin: 14px auto 0; background: #22306B; color: #F7F3E9; border: 0; border-radius: 12px; padding: 12px 26px; font-weight: 800; font-size: 15px; }
  #gate .mal { color: #B4232A; font-weight: 700; margin-top: 10px; min-height: 20px; }
  #gate label { color: #44507E; font-size: 13px; display: block; margin-top: 12px; }
  .buscar { width: 100%; border: 1.5px solid #D9D0BA; border-radius: 10px; padding: 9px 10px; font-size: 14px; color: #22306B; background: #FFFFFF; margin-bottom: 10px; }
  .vacio { color: #5A648F; text-align: center; padding: 30px 10px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Leads Linktree · GOLDEN OCLOCK</h1>
  <div class="sub" id="cab">Tandas de venta por WhatsApp · los mensajes los manda Aissa a mano</div>
</header>
<div id="gate">
  <h2>PIN</h2>
  <p>Escribe el PIN de 4 cifras de Páginas para abrir la lista.</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <label><input type="checkbox" id="rec" checked> Recordar 30 días en este aparato</label>
  <button id="abrir">Abrir</button>
  <div class="mal" id="mal"></div>
</div>
<nav id="nav" style="display:none">
  <button data-t="tanda" class="on">📋 Tanda</button>
  <button data-t="clientes">💎 Clientes</button>
  <button data-t="recla">🛟 Reclamaciones</button>
  <button data-t="informe">📈 Informe</button>
</nav>
<main id="main" style="display:none"></main>
<div class="pie" id="pie" style="display:none">
  <button class="sec" id="btnCopiar">Copiar resumen</button>
  <button id="btnExportar">Exportar estado</button>
</div>
<script src="app.js"></script>
</body>
</html>
